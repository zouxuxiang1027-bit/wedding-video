name: Render Wedding Video

on:
  workflow_dispatch:  # 手动触发
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'

jobs:
  render:
    runs-on: ubuntu-22.04  # v3 起：避免 24.04 libasound2 问题

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium  # runner 已预装系统依赖，无需 --with-deps

      - name: Install ffprobe-static
        run: npm install ffprobe-static --no-save

      - name: Render wedding video
        run: |
          CHROME=$(find "$HOME/.cache/ms-playwright" -name chrome -type f | head -1)
          FFMPEG=$(node -e "console.log(require('ffmpeg-static'))")
          FFPROBE=$(node -e "console.log(require('ffprobe-static').path)")
          sudo ln -sf "$FFMPEG" /usr/local/bin/ffmpeg
          sudo ln -sf "$FFPROBE" /usr/local/bin/ffprobe
          npx remotion render src/index.ts wedding-opening out/video.mp4 \
            --browser-executable="$CHROME" --ffmpeg-executable="$FFMPEG" \
            --ffprobe-executable="$FFPROBE" --concurrency=2

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: wedding-video
          path: out/video.mp4
          retention-days: 30

      - name: Summary
        run: |
          echo "## Video Rendered Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "- **File**: out/video.mp4" >> $GITHUB_STEP_SUMMARY
          echo "- **Size**: $(du -h out/video.mp4 | cut -f1)" >> $GITHUB_STEP_SUMMARY
          ls -lh out/
