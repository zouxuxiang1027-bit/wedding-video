name: Render Wedding Video

on:
  workflow_dispatch:  # 手动触发
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'

jobs:
  render:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser ffmpeg fonts-noto-cjk

      - name: Render wedding video
        run: npx remotion render src/index.ts wedding-opening out/video.mp4 --browser-executable=$(which chromium-browser) --concurrency=2
        env:
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: true
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium-browser

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: wedding-video
          path: out/video.mp4
          retention-days: 30

      - name: Summary
        run: |
          echo "## Video Rendered Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "- **File**: out/video.mp4" >> $GITHUB_STEP_SUMMARY
          echo "- **Size**: $(du -h out/video.mp4 | cut -f1)" >> $GITHUB_STEP_SUMMARY
          ls -lh out/
